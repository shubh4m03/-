name: Sync GitHub contributions

# Refreshes public/data/github-contributions.json (fallback data for the GitHub dot-matrix graph)
# from github.com's public contribution calendar. Runs every 6 hours and can be triggered manually.
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributions-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github-contributions.mjs shubh4m03
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/github-contributions.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/github-contributions.json
          git commit -m "chore: sync GitHub contributions"
          git push
